<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="description" content="Everyday essentials from your neighbourhood shop, delivered locally." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Self-hosted Mukta: preload the two weights used above the fold -->
    <link rel="preload" href="/fonts/mukta-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mukta-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Runs before first paint: apply the saved theme and effects tier (no flash), and preload the
      // Devanagari face when the saved language is Nepali (those files are large, so only then).
      (function () {
        try {
          var d = document.documentElement;
          var theme = localStorage.getItem("theme");
          // Light unless the visitor chose dark or "system" (then the media query decides).
          if (theme !== "system") d.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
          if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121311");
          var fx = localStorage.getItem("fx");
          d.setAttribute("data-fx", fx === "full" ? "full" : "lite");
          if (localStorage.getItem("lang") === "ne") {
            d.lang = "ne";
            var l = document.createElement("link");
            l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
            l.href = "/fonts/mukta-devanagari-400-normal.woff2";
            document.head.appendChild(l);
          }
        } catch (e) { d.setAttribute("data-theme", "light"); /* storage blocked: light theme, Lite effects */ }
      })();
    </script>
    <title>Local Business Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
